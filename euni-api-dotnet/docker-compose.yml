# Chạy thử cả API + PostgreSQL + MinIO:  docker compose up --build   → http://127.0.0.1:3000   (chưa được chạy thử trong môi trường dựng repo)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/v2/compose-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  minio:
    image: minio/minio
    command: server /data
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [ 'miniodata:/data' ]
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, minio: { condition: service_started } }
    ports: ['3000:3000']
    environment:
      DATABASE_URL: Host=db;Database=euni_cms;Username=cms_app;Password=cms_app_dev
      DATABASE_ADMIN_URL: Host=db;Database=euni_cms;Username=cms_admin;Password=cms_admin_dev
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
volumes: { pgdata: {}, miniodata: {} }
