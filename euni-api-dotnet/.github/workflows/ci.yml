name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tạo database + role (cms_admin BYPASSRLS, cms_app NOBYPASSRLS)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE cms_admin LOGIN BYPASSRLS PASSWORD 'cms_admin_dev'" \
            -c "CREATE ROLE cms_app LOGIN NOBYPASSRLS PASSWORD 'cms_app_dev'" -c "CREATE DATABASE euni_cms OWNER cms_admin"
      - run: dotnet build -c Release
      - name: Kiểm thử đơn vị + RLS trên PostgreSQL
        env:
          TEST_DATABASE_URL: Host=localhost;Database=euni_cms;Username=cms_app;Password=cms_app_dev
          TEST_DATABASE_ADMIN_URL: Host=localhost;Database=euni_cms;Username=cms_admin;Password=cms_admin_dev
        run: dotnet test -c Release --no-build
      - name: Kiểm thử hợp đồng/hành vi API (123 kiểm tra của mock, chạy vào bản .NET)
        run: |
          dotnet src/HUMG.CMS.Api/bin/Release/net8.0/HUMG.CMS.Api.dll &
          sleep 8
          SMOKE_URL=http://127.0.0.1:3000 node tests/contract/smoke.mjs
        env:
          PORT: '3000'
          API_LOG: 'false'
          DATABASE_URL: Host=localhost;Database=euni_cms;Username=cms_app;Password=cms_app_dev
          DATABASE_ADMIN_URL: Host=localhost;Database=euni_cms;Username=cms_admin;Password=cms_admin_dev
      - name: Kiểm thử schema v2 (RLS bảng con)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE euni_v2"
          psql -h localhost -U postgres -d euni_v2 -v ON_ERROR_STOP=1 -q -f database/v2/schema.sql -f database/v2/test.sql
